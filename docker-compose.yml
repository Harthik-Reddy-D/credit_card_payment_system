services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: credit_card_db
      MYSQL_USER: credituser
      MYSQL_PASSWORD: creditpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
  payment-service:
    build: ./backend/payment_service
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["8001:8000"]
  django:
    build: ./backend/django_app
    environment:
      DJANGO_SECRET_KEY: change-this-in-production
      MYSQL_HOST: mysql
      MYSQL_DATABASE: credit_card_db
      MYSQL_USER: credituser
      MYSQL_PASSWORD: creditpass
      PAYMENT_SERVICE_URL: http://payment-service:8000
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: Admin@12345
    depends_on:
      mysql: {condition: service_healthy}
      payment-service: {condition: service_started}
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [django]
    ports: ["3000:3000"]
    environment:
      VITE_API_URL: http://localhost:8000/api
volumes:
  mysql_data:
